manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: george-norton
      url-base: https://github.com/george-norton
    - name: petejohanson
      url-base: https://github.com/petejohanson
    - name: sadekbaroudi
      url-base: https://github.com/sadekbaroudi
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Had to switch off v0.2.1 to main because wired split wasn't working
    # - name: zmk
    #   remote: zmkfirmware
    #   revision: v0.2.1
    #   import: app/west.yml
    - name: zmk-driver-pmw3360
      remote: george-norton
      revision: main
    - name: chiptuner-zmk-module
      remote: petejohanson
      revision: main
  self:
    path: config
    import: deps.yml
